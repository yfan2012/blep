[package]
name = "blep"
version = "0.1.0"
edition = "2024"
description = "GPU-accelerated sequence alignment tool using WFA algorithm (CUDA)"
authors = ["MLEM Team"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
bio = "1.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
csv = "1.2"
flate2 = "1.0"
niffler = "2.4"
cudarc = { version = "0.16", features = ["cuda-12090"] }

[build-dependencies]
